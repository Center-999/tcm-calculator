<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中药智能算价器 · 拍照识方</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
  // Tesseract.js CDN 备用源（国内访问更快）
  if (typeof Tesseract === 'undefined') {
    var s = document.createElement('script');
    s.src = 'https://unpkg.com/tesseract.js@5/dist/tesseract.min.js';
    document.head.appendChild(s);
  }
</script>
<style>
  /* 系统原生中文字体（微信/国内浏览器可用） */
  /* 衬线字体用于标题，无衬线用于正文，确保任何环境都能正常显示 */
  :root {
    --rice-paper: #F5F0E8;
    --rice-paper-deep: #EDE5D3;
    --ink: #2C2C2C;
    --ink-light: #5C5548;
    --ink-faint: #9B9486;
    --cinnabar: #C13B2A;
    --cinnabar-light: #E8584A;
    --cinnabar-dark: #8B2A1E;
    --gold: #C4A35A;
    --gold-light: #E8D5A3;
    --gold-faint: rgba(196, 163, 90, 0.15);
    --mahogany: #6B4226;
    --mahogany-light: #8B6342;
    --herb-green: #5A7247;
    --herb-green-light: #7A9B62;
    --card-bg: rgba(255, 252, 245, 0.88);
    --card-border: rgba(196, 163, 90, 0.3);
    --shadow-soft: 0 2px 20px rgba(107, 66, 38, 0.08);
    --shadow-deep: 0 8px 32px rgba(107, 66, 38, 0.15);
    --radius: 6px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'WenQuanYi Micro Hei', sans-serif;
    background: var(--rice-paper);
    color: var(--ink);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 50%, rgba(196, 163, 90, 0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 20%, rgba(193, 59, 42, 0.04) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 80%, rgba(90, 114, 71, 0.06) 0%, transparent 50%),
      url("data:image/svg+xml,%3Csvg width='100' height='100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }

  .header-ornament {
    height: 6px;
    background: repeating-linear-gradient(
      90deg, var(--cinnabar) 0px, var(--cinnabar) 12px,
      transparent 12px, transparent 16px,
      var(--gold) 16px, var(--gold) 28px,
      transparent 28px, transparent 32px
    );
    opacity: 0.7;
  }

  header {
    position: relative;
    z-index: 1;
    padding: 32px 40px 24px;
    text-align: center;
  }

  header h1 {
    font-family: 'STKaiti', 'KaiTi', '楷体', 'Kai', serif;
    font-size: 2.6rem;
    color: var(--ink);
    letter-spacing: 0.15em;
    position: relative;
    display: inline-block;
  }

  header h1::before, header h1::after {
    content: '◆';
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    color: var(--cinnabar);
    font-size: 0.5rem;
    opacity: 0.6;
  }
  header h1::before { left: -30px; }
  header h1::after { right: -30px; }

  header .subtitle {
    font-size: 0.9rem;
    color: var(--ink-faint);
    margin-top: 8px;
    letter-spacing: 0.3em;
    font-weight: 200;
  }
  .header-line {
    width: 200px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 14px auto 0;
  }

  .main-container {
    position: relative;
    z-index: 1;
    max-width: 1400px;
    margin: 0 auto;
    padding: 20px 30px 60px;
    display: grid;
    grid-template-columns: 1fr 400px;
    gap: 28px;
  }

  /* ===== 左侧：OCR + 药材库 ===== */
  .left-panel { display: flex; flex-direction: column; gap: 20px; }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    backdrop-filter: blur(10px);
    overflow: hidden;
    box-shadow: var(--shadow-soft);
    animation: fadeSlideUp 0.5s ease forwards;
  }

  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--card-border);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .card-header .icon { font-size: 1.2rem; }
  .card-header h3 {
    font-family: 'STKaiti', 'KaiTi', '楷体', 'Kai', serif;
    font-size: 1.15rem;
    letter-spacing: 0.08em;
    color: var(--ink);
  }
  .card-body { padding: 20px; }

  /* 上传区域 */
  .upload-zone {
    border: 2px dashed var(--card-border);
    border-radius: var(--radius);
    padding: 36px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
  }
  .upload-zone:hover, .upload-zone.dragover {
    border-color: var(--gold);
    background: var(--gold-faint);
  }
  .upload-zone .upload-icon {
    font-size: 2.5rem;
    color: var(--gold);
    margin-bottom: 10px;
    display: block;
  }
  .upload-zone .upload-text {
    font-size: 0.95rem;
    color: var(--ink-light);
    letter-spacing: 0.1em;
  }
  .upload-zone .upload-hint {
    font-size: 0.78rem;
    color: var(--ink-faint);
    margin-top: 6px;
  }
  .upload-zone input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
  }

  .image-preview {
    display: none;
    position: relative;
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--card-border);
  }
  .image-preview img {
    width: 100%;
    max-height: 300px;
    object-fit: contain;
    background: #f0ebe2;
    display: block;
  }
  .image-preview .preview-actions {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 12px;
    background: linear-gradient(transparent, rgba(0,0,0,0.5));
    display: flex;
    gap: 10px;
    justify-content: center;
  }

  .btn {
    padding: 8px 18px;
    border-radius: var(--radius);
    font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'WenQuanYi Micro Hei', sans-serif;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.3s;
    letter-spacing: 0.08em;
    border: 1px solid transparent;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn.primary {
    background: var(--cinnabar);
    border-color: var(--cinnabar);
    color: white;
  }
  .btn.primary:hover { background: var(--cinnabar-dark); }
  .btn.primary:disabled {
    background: var(--ink-faint);
    border-color: var(--ink-faint);
    cursor: not-allowed;
  }
  .btn.secondary {
    background: transparent;
    border-color: var(--card-border);
    color: var(--ink-light);
  }
  .btn.secondary:hover { border-color: var(--gold); }
  .btn.ghost {
    background: rgba(255,255,255,0.7);
    border-color: rgba(255,255,255,0.5);
    color: var(--ink);
  }
  .btn.ghost:hover { background: white; }

  /* OCR 进度 */
  .ocr-progress {
    display: none;
    padding: 20px;
    text-align: center;
  }
  .ocr-progress.active { display: block; }
  .progress-bar {
    width: 100%;
    height: 4px;
    background: var(--rice-paper-deep);
    border-radius: 2px;
    overflow: hidden;
    margin: 12px 0;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold), var(--cinnabar));
    border-radius: 2px;
    transition: width 0.3s;
    width: 0%;
  }
  .progress-text {
    font-size: 0.82rem;
    color: var(--ink-faint);
  }

  /* 识别文本区 */
  .ocr-text-area {
    width: 100%;
    min-height: 120px;
    padding: 14px;
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    background: rgba(255,252,245,0.6);
    font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'WenQuanYi Micro Hei', sans-serif;
    font-size: 0.92rem;
    line-height: 1.8;
    color: var(--ink);
    resize: vertical;
    transition: border-color 0.3s;
  }
  .ocr-text-area:focus {
    outline: none;
    border-color: var(--gold);
    box-shadow: 0 0 0 3px var(--gold-faint);
  }
  .ocr-text-area::placeholder { color: var(--ink-faint); }

  .parse-actions {
    display: flex;
    gap: 10px;
    margin-top: 12px;
    flex-wrap: wrap;
  }

  /* 解析结果预览 */
  .parse-preview {
    margin-top: 16px;
  }
  .parse-preview-title {
    font-size: 0.85rem;
    color: var(--ink-faint);
    letter-spacing: 0.1em;
    margin-bottom: 10px;
  }

  .preview-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.88rem;
  }
  .preview-table th {
    text-align: left;
    padding: 8px 10px;
    color: var(--ink-faint);
    font-weight: 400;
    border-bottom: 1px solid var(--card-border);
    font-size: 0.78rem;
    letter-spacing: 0.08em;
  }
  .preview-table td {
    padding: 10px;
    border-bottom: 1px dashed rgba(196,163,90,0.15);
    vertical-align: middle;
  }
  .preview-table tr:last-child td { border-bottom: none; }
  .preview-table .herb-cell {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .preview-table .herb-cell .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .status-dot.ok { background: var(--herb-green); }
  .status-dot.warn { background: var(--gold); }
  .status-dot.err { background: var(--cinnabar); }

  .preview-table .price-cell {
    color: var(--cinnabar);
    font-weight: 600;
    text-align: right;
  }
  .preview-table .input-cell input {
    width: 50px;
    text-align: center;
    border: 1px solid var(--card-border);
    border-radius: 4px;
    padding: 4px;
    font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'WenQuanYi Micro Hei', sans-serif;
    font-size: 0.85rem;
    background: transparent;
  }
  .preview-table .input-cell input:focus {
    outline: none;
    border-color: var(--gold);
  }

  /* 未识别提示 */
  .unmatched-box {
    margin-top: 12px;
    padding: 12px 14px;
    background: rgba(193,59,42,0.04);
    border: 1px dashed rgba(193,59,42,0.2);
    border-radius: var(--radius);
    font-size: 0.82rem;
    color: var(--cinnabar-dark);
    line-height: 1.8;
  }
  .unmatched-box .um-title {
    font-weight: 600;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* 明显档位切换 */
  .tier-switcher {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  .tier-switcher .ts-label {
    font-size: 0.8rem;
    color: var(--ink-light);
    letter-spacing: 0.05em;
    margin-right: 4px;
    flex-shrink: 0;
  }
  .tier-btn {
    padding: 6px 14px;
    border-radius: 4px;
    border: 1.5px solid var(--card-border);
    background: transparent;
    cursor: pointer;
    font-size: 0.82rem;
    color: var(--ink-light);
    transition: all 0.25s;
    font-family: inherit;
    letter-spacing: 0.03em;
    flex-shrink: 0;
  }
  .tier-btn:hover {
    border-color: var(--gold);
    background: var(--gold-faint);
  }
  .tier-btn.active {
    border-color: var(--cinnabar);
    background: var(--cinnabar);
    color: #fff;
    font-weight: 600;
    box-shadow: 0 2px 8px rgba(193, 59, 42, 0.25);
  }
  .tier-btn.tier-base.active {
    border-color: var(--herb-green);
    background: var(--herb-green);
    box-shadow: 0 2px 8px rgba(90, 114, 71, 0.25);
  }

  /* 调价款加粗 */
  .selected-item.adjustment {
    background: rgba(196, 163, 90, 0.06);
    border-radius: 4px;
    margin: 0 -4px;
    padding-left: 12px;
    padding-right: 12px;
  }
  .selected-item.adjustment .item-name {
    font-weight: 900;
    color: var(--mahogany);
    font-size: 0.95rem;
  }
  .selected-item.adjustment .item-subtotal {
    font-weight: 900;
    font-size: 1rem;
  }

  /* 药材库 */
  .search-bar {
    position: relative;
    margin-bottom: 12px;
  }
  .search-bar input {
    width: 100%;
    padding: 12px 16px 12px 42px;
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    background: var(--card-bg);
    font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'WenQuanYi Micro Hei', sans-serif;
    font-size: 0.9rem;
    color: var(--ink);
  }
  .search-bar input::placeholder { color: var(--ink-faint); letter-spacing: 0.1em; }
  .search-bar input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-faint); }
  .search-bar .search-icon {
    position: absolute;
    left: 14px; top: 50%;
    transform: translateY(-50%);
    color: var(--ink-faint);
    font-size: 1rem;
  }

  .category-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .cat-tab {
    padding: 6px 14px;
    border: 1px solid var(--card-border);
    border-radius: 20px;
    background: transparent;
    font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'WenQuanYi Micro Hei', sans-serif;
    font-size: 0.78rem;
    color: var(--ink-light);
    cursor: pointer;
    transition: all 0.3s;
    letter-spacing: 0.05em;
  }
  .cat-tab:hover { border-color: var(--gold); color: var(--mahogany); }
  .cat-tab.active { background: var(--mahogany); border-color: var(--mahogany); color: var(--rice-paper); }

  .herb-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 10px;
    max-height: 280px;
    overflow-y: auto;
    padding-right: 6px;
  }
  .herb-grid::-webkit-scrollbar { width: 4px; }
  .herb-grid::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 2px; }

  .herb-card {
    background: rgba(255,252,245,0.5);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 12px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    transition: all 0.3s;
    animation: fadeIn 0.4s ease forwards;
    opacity: 0;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .herb-card:hover { border-color: var(--gold); box-shadow: var(--shadow-soft); transform: translateY(-1px); }
  .herb-card.added { border-color: var(--cinnabar); background: rgba(193,59,42,0.04); }
  .herb-info { flex: 1; min-width: 0; }
  .herb-name { font-size: 0.95rem; font-weight: 600; letter-spacing: 0.06em; }
  .herb-name .alias { font-size: 0.72rem; color: var(--ink-faint); font-weight: 400; margin-left: 4px; }
  .herb-meta { font-size: 0.72rem; color: var(--ink-faint); margin-top: 3px; }
  .herb-price { font-size: 1rem; font-weight: 700; color: var(--cinnabar); white-space: nowrap; margin-right: 8px; }
  .herb-price .unit { font-size: 0.65rem; font-weight: 400; color: var(--ink-faint); }
  .add-btn {
    width: 26px; height: 26px;
    border: 1.5px solid var(--card-border);
    border-radius: 50%;
    background: transparent;
    color: var(--gold);
    font-size: 1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
    flex-shrink: 0;
    line-height: 1;
  }
  .add-btn:hover { background: var(--cinnabar); border-color: var(--cinnabar); color: white; transform: rotate(90deg); }
  .add-btn.added { background: var(--cinnabar); border-color: var(--cinnabar); color: white; }

  /* ===== 右侧：处方面板 ===== */
  .prescription-panel {
    position: sticky;
    top: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .prescription-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    backdrop-filter: blur(10px);
    overflow: hidden;
    box-shadow: var(--shadow-soft);
  }
  .prescription-header {
    padding: 18px 22px;
    border-bottom: 1px solid var(--card-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .prescription-title {
    font-family: 'STKaiti', 'KaiTi', '楷体', 'Kai', serif;
    font-size: 1.2rem;
    letter-spacing: 0.1em;
  }
  .prescription-count {
    font-size: 0.78rem;
    color: var(--ink-faint);
    padding: 3px 10px;
    border: 1px solid var(--card-border);
    border-radius: 12px;
  }

  .selected-list {
    padding: 10px 14px;
    max-height: 45vh;
    overflow-y: auto;
    min-height: 80px;
  }
  .selected-list::-webkit-scrollbar { width: 3px; }
  .selected-list::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 2px; }
  .empty-msg {
    text-align: center;
    color: var(--ink-faint);
    font-size: 0.82rem;
    padding: 24px 0;
    letter-spacing: 0.1em;
  }

  .selected-item {
    display: flex;
    align-items: center;
    padding: 10px 6px;
    border-bottom: 1px dashed rgba(196,163,90,0.15);
    animation: fadeIn 0.3s ease;
  }
  .selected-item:last-child { border-bottom: none; }
  .item-name { flex: 1; font-size: 0.88rem; font-weight: 600; letter-spacing: 0.04em; }
  .dose-control { display: flex; align-items: center; gap: 5px; margin: 0 8px; }
  .dose-btn {
    width: 22px; height: 22px;
    border: 1px solid var(--card-border);
    border-radius: 4px;
    background: transparent;
    color: var(--ink-light);
    font-size: 0.8rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .dose-btn:hover { background: var(--gold-faint); border-color: var(--gold); }
  .dose-input {
    width: 38px;
    text-align: center;
    border: none;
    background: transparent;
    font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'WenQuanYi Micro Hei', sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    padding: 2px;
  }
  .dose-input:focus { outline: none; background: var(--gold-faint); border-radius: 3px; }
  .dose-unit { font-size: 0.68rem; color: var(--ink-faint); }
  .item-subtotal { font-size: 0.85rem; font-weight: 600; color: var(--cinnabar); min-width: 52px; text-align: right; }
  .remove-btn {
    margin-left: 6px;
    border: none;
    background: transparent;
    color: var(--ink-faint);
    cursor: pointer;
    font-size: 0.8rem;
    transition: color 0.2s;
    padding: 4px;
  }
  .remove-btn:hover { color: var(--cinnabar); }

  /* 总价大卡片 */
  .big-price-card {
    background: linear-gradient(135deg, var(--cinnabar) 0%, var(--cinnabar-dark) 100%);
    border-radius: var(--radius);
    padding: 20px 22px;
    color: white;
    text-align: center;
    margin-bottom: 16px;
    box-shadow: 0 4px 16px rgba(193,59,42,0.25);
  }
  .big-price-card .bp-label {
    font-size: 0.85rem;
    letter-spacing: 0.2em;
    opacity: 0.85;
    margin-bottom: 6px;
  }
  .big-price-card .bp-value {
    font-size: 2.6rem;
    font-weight: 900;
    font-family: 'STKaiti', 'KaiTi', '楷体', 'Kai', serif;
    letter-spacing: 0.03em;
    line-height: 1;
    transition: transform 0.2s ease;
  }
  .big-price-card .bp-value.flash {
    animation: priceFlash 0.4s ease;
  }
  @keyframes priceFlash {
    0% { transform: scale(1); }
    50% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }
  .big-price-card .bp-detail {
    font-size: 0.75rem;
    opacity: 0.7;
    margin-top: 8px;
    letter-spacing: 0.05em;
  }

  /* 总价区域（页面顶部） */
  .top-price-section {
    position: relative;
    z-index: 1;
    max-width: 1400px;
    margin: 0 auto 20px;
    padding: 0 30px;
  }
  .top-price-section .big-price-card {
    margin-bottom: 0;
  }

  /* 剂数调节器 */

<header>
  <h1>中药智能算价器</h1>

  <div class="header-line"></div>

  </div>
</div>

<main class="main-container">
  <section class="left-panel">

        <h3>上传处方照片</h3>
      </div>

        <div class="upload-zone" id="uploadZone">

        <div class="image-preview" id="imagePreview">

          </div>
        </div>
        <div class="ocr-progress" id="ocrProgress">
          <div class="progress-text" id="progressText">正在加载识别引擎...</div>

        </div>
      </div>
    </div>

    <!-- 识别文本 + 解析 -->

生姜 10g
大枣 12g
甘草 6g
柴胡 12g
黄芩 10g
半夏 10g

白术 10g</textarea>

let selectedHerbs = [];
let currentCategory = '全部';
let parsedResults = []; // 解析预览暂存
let currentImageFile = null;
let currentTier = 0; // 默认原价档（不加调价款）
const ADJUSTMENT_ID = -1; // 调价款虚拟ID
const FALLBACK_ID = -2; // 兜底价虚拟ID

// ===================== 初始化 =====================
function init() {
  renderCategoryTabs();
  renderHerbGrid();
  setupDragDrop();
}

// ===================== 上传 & OCR =====================
function setupDragDrop() {
  const zone = document.getElementById('uploadZone');
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('dragover'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
  zone.addEventListener('drop', e => {
    e.preventDefault();
    zone.classList.remove('dragover');
    const files = e.dataTransfer.files;
    if (files.length) handleFile(files[0]);
  });
}

function handleFileSelect(e) {
  if (e.target.files.length) handleFile(e.target.files[0]);
}

function handleFile(file) {
  if (!file.type.startsWith('image/')) {
    showToast('请上传图片文件');
    return;
  }
  currentImageFile = file;
  const reader = new FileReader();
  reader.onload = ev => {
    document.getElementById('previewImg').src = ev.target.result;
    document.getElementById('uploadZone').style.display = 'none';
    document.getElementById('imagePreview').style.display = 'block';
    document.getElementById('ocrResultCard').style.display = 'block';
  };
  reader.readAsDataURL(file);
}

function removeImage() {
  currentImageFile = null;
  document.getElementById('previewImg').src = '';
  document.getElementById('uploadZone').style.display = 'block';
  document.getElementById('imagePreview').style.display = 'none';
  document.getElementById('fileInput').value = '';
}

async function startOCR() {
  if (!currentImageFile) return;
  const btn = document.getElementById('ocrBtn');
  const progress = document.getElementById('ocrProgress');
  const fill = document.getElementById('progressFill');
  const text = document.getElementById('progressText');

  btn.disabled = true;
  progress.classList.add('active');
  text.textContent = '正在加载中文识别模型（首次使用需下载，约10MB）...';
  fill.style.width = '10%';

  try {
    const worker = await Tesseract.createWorker('chi_sim', 1, {
      logger: m => {
        if (m.status === 'recognizing text') {
          const pct = Math.round(m.progress * 90) + 10;
          fill.style.width = pct + '%';
          text.textContent = `正在识别文字... ${Math.round(m.progress * 100)}%`;
        } else if (m.status === 'loading language traineddata') {
          fill.style.width = '5%';
          text.textContent = '正在加载中文训练数据...';
        }
      }
    });

    fill.style.width = '95%';
    text.textContent = '正在解析结果...';
    const result = await worker.recognize(currentImageFile);
    await worker.terminate();

    document.getElementById('ocrText').value = result.data.text;
    fill.style.width = '100%';
    text.textContent = '识别完成！';
    showToast('处方文字识别成功');

    // 自动解析
    setTimeout(() => {
      parseAndCalculate();
      progress.classList.remove('active');
    }, 600);

  } catch (err) {
    console.error(err);
    text.textContent = '识别失败，已按默认价兜底出价';
    // 兜底：OCR异常时直接按默认价出价
    applyFallbackPricing('OCR识别异常');
    progress.classList.remove('active');
  } finally {
    btn.disabled = false;
  }
}

// ===================== 解析药方文字 =====================
// 兜底：识别失败时，用默认单剂价格（50~60元随机）按剂数出价
function applyFallbackPricing(reason) {
  // 单剂基准 50~60 元随机
  const baseMin = 50;
  const baseMax = 60;
  const singleBase = +(baseMin + Math.random() * (baseMax - baseMin)).toFixed(2);
  // 清空已有药材，只放一个兜底虚拟项
  selectedHerbs = [{
    id: FALLBACK_ID,
    name: '默认处方',
    alias: reason || '识别失败',
    category: '其他',
    price: singleBase,
    unit: '剂',
    effect: '兜底计价',
    dose: 1
  }];
  // 兜底价不受档位影响，重置为原价档
  currentTier = 0;
  document.querySelectorAll('.tier-btn').forEach(btn => {
    btn.classList.toggle('active', parseInt(btn.dataset.tier) === 0);
  });
  renderHerbGrid();
  renderSelectedList();
  updateSummary();
  const total = (singleBase * doseCount).toFixed(2);
  showToast(`识别失败，已按默认价 单剂¥${singleBase} × ${doseCount}剂 = ¥${total}`);
}

function parseAndCalculate() {
  const text = document.getElementById('ocrText').value.trim();
  if (!text) { showToast('请输入或识别药方文字'); return; }

  const lines = text.split(/[\n\r]+/).map(l => l.trim()).filter(l => l);
  parsedResults = [];
  const unmatched = [];

  for (const line of lines) {
    const result = parseLine(line);
    if (result && result.herb) {
      parsedResults.push(result);
    } else if (line.length >= 2 && !/^\d+$/.test(line)) {
      unmatched.push(line);
    }
  }

  const matched = parsedResults.filter(r => r.herb);
  if (matched.length === 0) {
    // 兜底：没识别到药材，直接按默认价出价
    applyFallbackPricing('未识别到药材');
    renderParsePreview(unmatched);
    return;
  }

  // 直接加入处方（无需预览确认）
  for (const r of matched) {
    const existing = selectedHerbs.find(s => s.id === r.herb.id);
    if (existing) {
      existing.dose = Math.min(200, existing.dose + r.dose);
    } else {
      selectedHerbs.push({ ...r.herb, dose: r.dose });
    }
  }

  renderHerbGrid();
  renderSelectedList();
  updateSummary();

  if (unmatched.length > 0) {
    showToast(`已识别 ${matched.length} 味药材，${unmatched.length} 行未识别`);
  } else {
    showToast(`成功识别 ${matched.length} 味药材，共 ¥${selectedHerbs.reduce((s,h) => s + h.price * h.dose, 0).toFixed(2)}`);
  }
}

// 解析单行：药材名 + 剂量
function parseLine(line) {
  // 清洗常见噪声字符
  let cleaned = line.replace(/[\s\t]+/g, ' ').trim();

  // 尝试匹配：药名 剂量 或 药名：剂量
  // 模式1: 药材名 + 空格/冒号 + 数字 + 单位
  const dosePattern = /(\d+\.?\d*)\s*(g|克|钱|两|分|grams?|gm?)/i;
  const match = cleaned.match(dosePattern);

  let doseVal = null;
  let doseUnit = 'g';
  let herbPart = cleaned;

  if (match) {
    doseVal = parseFloat(match[1]);
    doseUnit = match[2].toLowerCase();
    herbPart = cleaned.substring(0, match.index).trim();
    // 去掉末尾的冒号、空格等
    herbPart = herbPart.replace(/[：:;；,，.。]+$/g, '').trim();
  } else {
    // 模式2: 纯数字作为剂量（如"当归 12"）
    const numMatch = cleaned.match(/^(.*?)\s+(\d+\.?\d*)\s*$/);
    if (numMatch) {
      herbPart = numMatch[1].trim();
      doseVal = parseFloat(numMatch[2]);
    }
  }

  if (!herbPart || herbPart.length < 2) return null;

  // 单位换算为克
  let doseInGrams = doseVal;
  if (doseUnit === '钱') doseInGrams = doseVal * 3;
  else if (doseUnit === '两') doseInGrams = doseVal * 30;
  else if (doseUnit === '分') doseInGrams = doseVal * 0.3;

  if (doseInGrams === null || isNaN(doseInGrams)) {
    // 无剂量，默认10克
    doseInGrams = 10;
  }
  doseInGrams = Math.round(doseInGrams);
  if (doseInGrams < 1) doseInGrams = 1;
  if (doseInGrams > 200) doseInGrams = 200;

  const herb = findHerb(herbPart);
  if (!herb) {
    return { raw: line, herb: null, matchedName: herbPart, dose: doseInGrams };
  }

  return { raw: line, herb, matchedName: herbPart, dose: doseInGrams };
}

// 智能药材匹配
function findHerb(query) {
  const q = query.trim();
  if (!q || q.length < 2) return null;

  // 1. 精确匹配名称
  let match = herbDatabase.find(h => h.name === q);
  if (match) return match;

  // 2. 精确匹配别名
  match = herbDatabase.find(h => {
    const aliases = h.alias.split(',').map(a => a.trim());
    return aliases.includes(q);
  });
  if (match) return match;

  // 3. 去掉常见炮制前缀后再匹配
  const prefixes = ['生', '熟', '炙', '炒', '煅', '醋', '酒', '盐', '姜', '蜜', '制', '焦', '炭', '煅', '煨', '蒸'];
  let cleanQ = q;
  for (const p of prefixes) {
    if (cleanQ.startsWith(p)) {
      cleanQ = cleanQ.slice(p.length);
      break;
    }
  }
  match = herbDatabase.find(h => h.name === cleanQ || h.alias.split(',').map(a => a.trim()).includes(cleanQ));
  if (match) return match;

  // 4. 去掉常见后缀（片/段/末/粉/炭）再匹配
  const suffixes = ['片', '段', '末', '粉', '炭', '块', '丝', '皮', '仁', '子', '壳', '花', '叶', '根', '草'];
  cleanQ = q;
  for (const s of suffixes) {
    if (cleanQ.endsWith(s) && cleanQ.length > s.length + 1) {
      cleanQ = cleanQ.slice(0, -s.length);
      match = herbDatabase.find(h => h.name === cleanQ || h.alias.split(',').map(a => a.trim()).includes(cleanQ));
      if (match) return match;
    }
  }

  // 5. 包含匹配（药材名包含查询词 或 查询词包含药材名）
  match = herbDatabase.find(h => h.name.includes(q) || q.includes(h.name));
  if (match) return match;

  // 6. 别名包含匹配
  match = herbDatabase.find(h => {
    return h.alias.split(',').some(a => a.trim().includes(q) || q.includes(a.trim()));
  });
  if (match) return match;

  // 7. OCR乱码容错：单字匹配（取药材名和查询词共有的汉字）
  // 提取查询词中的汉字
  const qChars = q.split('').filter(c => /[\u4e00-\u9fff]/.test(c));
  if (qChars.length >= 2) {
    let bestScore = 0;
    let bestHerb = null;
    for (const h of herbDatabase) {
      const hChars = h.name.split('');
      let score = 0;
      for (const c of qChars) {
        if (hChars.includes(c)) score++;
      }
      // 重叠字数越多得分越高，且至少占药材名一半以上
      if (score > bestScore && score >= Math.ceil(hChars.length / 2)) {
        bestScore = score;
        bestHerb = h;
      }
    }
    if (bestHerb) return bestHerb;
  }

  // 8. 首字匹配（OCR乱码时可能只认对第一个字）
  const firstChar = qChars[0];
  if (firstChar) {
    match = herbDatabase.find(h => h.name.startsWith(firstChar));
    if (match) return match;
  }

  return null;
}

// 渲染解析预览
function renderParsePreview(unmatched) {
  const preview = document.getElementById('parsePreview');
  const table = document.getElementById('previewTable');
  const umBox = document.getElementById('unmatchedBox');

  if (parsedResults.length === 0 && unmatched.length === 0) {
    showToast('未能识别到任何药材，请检查输入');
    preview.style.display = 'none';
    return;
  }

  const matched = parsedResults.filter(r => r.herb);

  let html = `<thead><tr>
    <th>状态</th><th>识别文字</th><th>匹配药材</th><th>剂量</th><th>单价</th><th>小计</th>
  </tr></thead><tbody>`;

  for (const r of parsedResults) {
    if (!r.herb) continue;
    const subtotal = (r.herb.price * r.dose).toFixed(2);
    html += `<tr>
      <td><div class="herb-cell"><span class="status-dot ok"></span></div></td>
      <td>${escapeHtml(r.raw)}</td>
      <td><strong>${r.herb.name}</strong> <span style="color:var(--ink-faint);font-size:0.75rem;">${r.matchedName !== r.herb.name ? '('+r.matchedName+')' : ''}</span></td>
      <td class="input-cell"><input type="number" value="${r.dose}" min="1" max="200" onchange="updateParsedDose(${parsedResults.indexOf(r)},this.value)"></td>
      <td>¥${r.herb.price < 0.1 ? r.herb.price.toFixed(3) : r.herb.price.toFixed(2)}/g</td>
      <td class="price-cell">¥${subtotal}</td>
    </tr>`;
  }

  // 未匹配的行
  for (const r of parsedResults) {
    if (r.herb) continue;
    html += `<tr>
      <td><div class="herb-cell"><span class="status-dot err"></span></div></td>
      <td>${escapeHtml(r.raw)}</td>
      <td colspan="4" style="color:var(--cinnabar);font-size:0.82rem;">未匹配到药材，请手动添加</td>
    </tr>`;
  }

  html += '</tbody>';
  table.innerHTML = html;

  if (unmatched.length > 0) {
    umBox.style.display = 'block';
    umBox.innerHTML = `<div class="um-title">⚠ 以下文字未能识别为药材：</div>${escapeHtml(unmatched.join('、'))}`;
  } else {
    umBox.style.display = 'none';
  }

  preview.style.display = 'block';
}

function updateParsedDose(idx, val) {
  if (parsedResults[idx]) {
    parsedResults[idx].dose = Math.max(1, Math.min(200, parseInt(val) || 1));
    // 重新渲染表格（简化：只重渲染）
    const unmatched = [];
    renderParsePreview(unmatched);
  }
}

function escapeHtml(str) {
  return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[m]));
}

// ===================== 药材库浏览 =====================
function renderCategoryTabs() {
  const categories = ['全部', ...new Set(herbDatabase.map(h => h.category))];
  const container = document.getElementById('categoryTabs');
  container.innerHTML = categories.map(cat =>
    `<button class="cat-tab ${cat === currentCategory ? 'active' : ''}" onclick="setCategory('${cat}')">${cat}</button>`
  ).join('');
}

function setCategory(cat) {
  currentCategory = cat;
  renderCategoryTabs();
  renderHerbGrid();
}

function renderHerbGrid() {
  const searchTerm = (document.getElementById('searchInput').value || '').toLowerCase();
  const grid = document.getElementById('herbGrid');

  let filtered = herbDatabase.filter(h => {
    const matchCat = currentCategory === '全部' || h.category === currentCategory;
    const matchSearch = !searchTerm ||
      h.name.includes(searchTerm) ||
      h.alias.toLowerCase().includes(searchTerm) ||
      h.effect.includes(searchTerm) ||
      h.category.includes(searchTerm);
    return matchCat && matchSearch;
  });

  grid.innerHTML = filtered.map((herb, i) => {
    const isSelected = selectedHerbs.find(s => s.id === herb.id);
    return `
      <div class="herb-card ${isSelected ? 'added' : ''}" style="animation-delay: ${i * 0.02}s">
        <div class="herb-info">
          <div class="herb-name">${herb.name}<span class="alias">${herb.alias.split(',')[0]}</span></div>
          <div class="herb-meta">${herb.category} · ${herb.effect}</div>
        </div>
        <span class="herb-price">¥${herb.price < 0.1 ? herb.price.toFixed(3) : herb.price.toFixed(2)}<span class="unit">/g</span></span>
        <button class="add-btn ${isSelected ? 'added' : ''}" onclick="toggleHerb(${herb.id})">${isSelected ? '✓' : '+'}</button>
      </div>
    `;
  }).join('');
}

function filterHerbs() { renderHerbGrid(); }

function toggleHerb(id) {
  const idx = selectedHerbs.findIndex(s => s.id === id);
  if (idx > -1) {
    selectedHerbs.splice(idx, 1);
    showToast('已移除药材');
  } else {
    const herb = herbDatabase.find(h => h.id === id);
    selectedHerbs.push({ ...herb, dose: 10 });
    showToast(`已添加 ${herb.name}`);
  }
  renderHerbGrid();
  renderSelectedList();
  updateSummary();
}

// ===================== 处方清单 =====================
function renderSelectedList() {
  const container = document.getElementById('selectedList');
  if (selectedHerbs.length === 0) {
    container.innerHTML = '<div class="empty-msg">上传处方照片或从左侧选取药材</div>';
    return;
  }
  container.innerHTML = selectedHerbs.map(item => {
    const isAdj = item.id === ADJUSTMENT_ID;
    const isFallback = item.id === FALLBACK_ID;
    const isVirtual = isAdj || isFallback;
    return `
    <div class="selected-item ${isAdj ? 'adjustment' : ''} ${isFallback ? 'adjustment' : ''}">
      <span class="item-name">${item.name}${isFallback ? ' <span style="font-size:0.7rem;color:var(--ink-faint);">（兜底）</span>' : ''}</span>
      ${isVirtual ? '' : `
      <div class="dose-control">
        <button class="dose-btn" onclick="changeDose(${item.id}, -1)">−</button>
        <input class="dose-input" type="number" value="${item.dose}" min="1" max="200" onchange="setDose(${item.id}, this.value)">
        <span class="dose-unit">g</span>
        <button class="dose-btn" onclick="changeDose(${item.id}, 1)">+</button>
      </div>`}
      ${isVirtual ? '<span></span>' : ''}
      <span class="item-subtotal">¥${(item.price * item.dose).toFixed(2)}</span>
      ${isVirtual ? '' : `<button class="remove-btn" onclick="toggleHerb(${item.id})">✕</button>`}
    </div>
  `;
  }).join('');
}

function changeDose(id, delta) {
  const item = selectedHerbs.find(s => s.id === id);
  if (item) {
    item.dose = Math.max(1, Math.min(200, item.dose + delta));
    renderSelectedList();
    updateSummary();
  }
}

function setDose(id, val) {
  const item = selectedHerbs.find(s => s.id === id);
  if (item) {
    item.dose = Math.max(1, Math.min(200, parseInt(val) || 1));
    renderSelectedList();
    updateSummary();
  }
}

// 计算基础价格（不含调价款和兜底价）
function getBasePrice() {
  return selectedHerbs
    .filter(h => h.id !== ADJUSTMENT_ID && h.id !== FALLBACK_ID)
    .reduce((sum, h) => sum + h.price * h.dose, 0);
}

// 计算应加金额
function calcAdjustment(basePrice) {
  if (currentTier === 0) return 0;
  const targetMin = currentTier === 1 ? 500 : currentTier === 2 ? 600 : 700;
  if (basePrice >= targetMin) return 0;
  const seed = Math.floor(basePrice * 100) % 80;
  const target = targetMin + seed;
  return Math.max(0, target - basePrice);
}

// 应用档次加价
function applyTierAdjustment() {
  const adjIdx = selectedHerbs.findIndex(h => h.id === ADJUSTMENT_ID);
  if (adjIdx > -1) selectedHerbs.splice(adjIdx, 1);

  const basePrice = getBasePrice();
  const adjustmentAmount = calcAdjustment(basePrice);

  if (adjustmentAmount > 0) {
    selectedHerbs.push({
      id: ADJUSTMENT_ID,
      name: '调价款',
      alias: '服务费',
      category: '其他',
      price: adjustmentAmount,
      unit: '份',
      effect: '价格调整',
      dose: 1
    });
  }
}

function updateSummary() {
  // 先应用档次加价（基于单剂价格）
  applyTierAdjustment();

  // 真实药材：排除调价款和兜底价
  const realHerbs = selectedHerbs.filter(h => h.id !== ADJUSTMENT_ID && h.id !== FALLBACK_ID);
  const count = realHerbs.length;
  const hasFallback = selectedHerbs.some(h => h.id === FALLBACK_ID);
  const singleWeight = realHerbs.reduce((sum, h) => sum + h.dose, 0);
  const singlePrice = selectedHerbs.reduce((sum, h) => sum + h.price * h.dose, 0);
  const totalPrice = singlePrice * doseCount;
  const totalWeight = singleWeight * doseCount;

  document.getElementById('totalCount').textContent = hasFallback ? '默认' : `${count} 味`;
  document.getElementById('totalWeight').textContent = hasFallback ? '—' : `${singleWeight} g`;
  document.getElementById('singleDosePrice').textContent = `¥${singlePrice.toFixed(2)}`;
  document.getElementById('doseCountDisplay').textContent = `${doseCount} 剂`;
  document.getElementById('totalPrice').textContent = `¥${totalPrice.toFixed(2)}`;
  document.getElementById('prescriptionCount').textContent = hasFallback ? '默认' : `${count} 味`;

  // 更新总价大卡片
  const bigPriceEl = document.getElementById('bigPriceValue');
  bigPriceEl.textContent = `¥${totalPrice.toFixed(2)}`;
  const detailText = hasFallback
    ? `默认价 · ${doseCount} 剂 · 单剂 ¥${singlePrice.toFixed(2)}`
    : `${count} 味 · ${doseCount} 剂 · 单剂 ¥${singlePrice.toFixed(2)}`;
  document.getElementById('bigPriceDetail').textContent = detailText;

  // 价格变化时闪一下
  bigPriceEl.classList.remove('flash');
  void bigPriceEl.offsetWidth;
  if (count > 0) bigPriceEl.classList.add('flash');
}

// 设置服用剂数
function setDoseCount(n) {
  doseCount = Math.max(1, Math.min(90, parseInt(n) || 1));
  // 更新按钮状态
  document.querySelectorAll('.dm-btn').forEach(btn => {
    const val = parseInt(btn.textContent);
    btn.classList.toggle('active', val === doseCount);
  });
  // 更新自定义输入框
  document.getElementById('dmCustom').value = doseCount;
  document.getElementById('dmCurrent').textContent = `${doseCount} 剂`;
  updateSummary();
}

// 切换档次
function setTier(tier) {
  currentTier = tier;
  document.querySelectorAll('.tier-btn').forEach(btn => {
    btn.classList.toggle('active', parseInt(btn.dataset.tier) === tier);
  });
  updateSummary();
  renderSelectedList();
}

function clearPrescription() {
  if (selectedHerbs.length === 0) return;
  selectedHerbs = [];
  setDoseCount(1);
  // 清空时重置为原价档
  currentTier = 0;
  document.querySelectorAll('.tier-btn').forEach(btn => {
    btn.classList.toggle('active', parseInt(btn.dataset.tier) === 0);
  });
  showToast('处方已清空');
  renderHerbGrid();
  renderSelectedList();
  updateSummary();
}

function exportPrescription() {
  if (selectedHerbs.length === 0) { showToast('处方为空'); return; }
  const realHerbs = selectedHerbs.filter(h => h.id !== ADJUSTMENT_ID && h.id !== FALLBACK_ID);
  const adjItem = selectedHerbs.find(h => h.id === ADJUSTMENT_ID);
  const fallbackItem = selectedHerbs.find(h => h.id === FALLBACK_ID);
  const singleWeight = realHerbs.reduce((sum, h) => sum + h.dose, 0);
  const basePrice = realHerbs.reduce((sum, h) => sum + h.price * h.dose, 0);
  const singlePrice = selectedHerbs.reduce((sum, h) => sum + h.price * h.dose, 0);
  const totalPrice = singlePrice * doseCount;
  const now = new Date();
  const dateStr = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日`;

  let text = `━━━━━━━━━━━━━━━━━━━━━━\n`;
  text += `       中 药 处 方 清 单\n`;
  text += `       ${dateStr}\n`;
  text += `━━━━━━━━━━━━━━━━━━━━━━\n\n`;
  if (fallbackItem) {
    text += `【默认计价】识别失败兜底\n`;
    text += `  默认处方（${fallbackItem.alias}）  1剂   ¥${fallbackItem.price.toFixed(2)}/剂   ¥${fallbackItem.price.toFixed(2)}\n`;
  } else {
    text += `【单剂处方】 共 ${realHerbs.length} 味\n`;
    text += `序号  药材名称      剂量   单价      小计\n`;
    text += `────────────────────────────────────\n`;
    realHerbs.forEach((item, i) => {
      const idx = String(i + 1).padStart(2, ' ');
      const name = item.name.padEnd(6, '　');
      const dose = `${item.dose}g`.padStart(5, ' ');
      const price = `¥${item.price < 0.1 ? item.price.toFixed(3) : item.price.toFixed(2)}/g`.padStart(10, ' ');
      const sub = `¥${(item.price * item.dose).toFixed(2)}`;
      text += `${idx}   ${name}    ${dose}  ${price}   ${sub}\n`;
    });
    if (adjItem) {
      text += `  *   调价款       1份   ¥${adjItem.price.toFixed(2)}/份   ¥${adjItem.price.toFixed(2)}\n`;
    }
  }
  text += `────────────────────────────────────\n`;
  text += `\n  单剂克重：${fallbackItem ? '—' : singleWeight + 'g'}\n`;
  text += `  单剂价格：¥${singlePrice.toFixed(2)}\n`;
  if (adjItem) {
    text += `    （药材 ¥${basePrice.toFixed(2)} + 调价 ¥${adjItem.price.toFixed(2)}）\n`;
  }
  text += `\n  服用剂数：${doseCount} 剂\n`;
  text += `  总克重：${fallbackItem ? '—' : singleWeight * doseCount + 'g'}\n`;
  text += `\n  ═══════════════════════\n`;
  text += `       总合计：¥${totalPrice.toFixed(2)}\n`;
  text += `  ═══════════════════════\n`;

  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `中药处方_${dateStr}.txt`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('处方清单已导出');
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

// 启动
init();
</script>
